<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DreamTalk — FoundingSmoke</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The canvas fills the viewport exactly. The scene is always rendered
       16:9 (three-host aspect()), so a viewport that is not 16:9 stretches
       it — and the gauntlet's comparator resizes the whole screenshot back
       to the reference's 1280x720 before scoring, which undoes the stretch
       exactly. Letterboxing here instead would survive that resize as a
       real geometric squash. */
    #stage { width: 100vw; height: 100vh; display: block; }
    #readout { position: fixed; bottom: 10px; left: 12px; color: #555; font: 12px monospace; }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div id="readout">booting…</div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
