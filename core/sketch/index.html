<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DreamTalk Whiteboard</title>
  <style>
    /* The sketchpad: a page, a pen, and almost nothing else. Dark by
       default (white ink on black); the light page inverts the ink and,
       through a filter, the symbol layer — hue-rotated back so a red
       symbol stays red. */
    :root {
      --bg: #050506;
      --page: #000;
      --edge: #1c1c20;
      --text: #8a8a94;
      --bright: #e8e8ee;
      --dim: #45454d;
      --blue: #00a2ff;
      --chip: #000;
      --amber: #e8a33d;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    :root[data-theme="light"] {
      --bg: #e9e9ec;
      --page: #fff;
      --edge: #d4d4da;
      --text: #6a6a72;
      --bright: #111;
      --dim: #a8a8b0;
      --chip: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font: 12px/1.4 -apple-system, "SF Pro", Inter, sans-serif; -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none; }

    #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center;
      gap: 4px; padding: 0 14px; white-space: nowrap; }
    #toolbar > * { flex-shrink: 0; }
    #toolbar #status, #toolbar .imports { flex-shrink: 1; min-width: 0; }
    #toolbar .brand { color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px;
      margin-right: 10px; }
    #toolbar button { background: none; border: 1px solid transparent; color: var(--text); font: inherit;
      height: 28px; min-width: 30px; padding: 0 9px; border-radius: 7px; cursor: pointer; }
    #toolbar button:hover:not(:disabled) { color: var(--bright); border-color: var(--edge); }
    #toolbar button:disabled { color: var(--dim); cursor: default; }
    #toolbar #transform { color: var(--blue); font-size: 14px; }
    #toolbar #transform:disabled { color: var(--dim); }
    #toolbar #live { color: var(--dim); }
    #toolbar #live.on { color: var(--blue); }
    #toolbar .sep { width: 1px; height: 16px; background: var(--edge); margin: 0 6px; }
    #status { margin-left: 10px; color: var(--bright); opacity: 0; transition: opacity 0.3s; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
    #status.on { opacity: 0.8; }
    #toolbar .spacer { flex: 1; }
    #toolbar button.imports { color: var(--dim); font: 10.5px var(--mono); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 42vw; text-align: left; }
    #toolbar button.imports::before { content: "import "; color: var(--text); }
    #toolbar button.imports:hover::before, #toolbar button.imports.on::before { color: var(--blue); }
    #toolbar button.imports.on { color: var(--bright); border-color: var(--edge); }
    #toolbar #board { width: 92px; height: 24px; margin-left: 12px; padding: 0 7px; border-radius: 6px;
      background: none; border: 1px solid var(--edge); color: var(--bright); font: 11px var(--mono); outline: none; }
    #toolbar #board:focus { border-color: var(--blue); }
    #toolbar a { color: var(--text); text-decoration: none; font-size: 11px; margin-left: 10px; }
    #toolbar a:hover { color: var(--bright); }

    /* The tablet: one quiet dot. Blue = streaming; hollow = asleep; a slow
       breath = searching; amber = waiting on its one-time key. */
    #toolbar .tabletdot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); margin-left: 12px;
      cursor: help; box-sizing: border-box; }
    #toolbar .tabletdot.connected { background: var(--blue); }
    #toolbar .tabletdot.asleep { background: none; border: 1.5px solid var(--dim); }
    #toolbar .tabletdot.searching { animation: breathe 2.4s ease-in-out infinite; }
    #toolbar .tabletdot.needs-key { background: var(--amber); }
    #toolbar .tabletdot.offline { background: none; border: 1.5px solid var(--edge); }
    @keyframes breathe { 50% { opacity: 0.25; } }

    #banner { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
      align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 6px 8px 6px 14px; border-radius: 8px;
      background: var(--page); box-shadow: 0 0 0 1px var(--edge); color: var(--text); white-space: nowrap; }
    #banner.on { display: flex; }
    #banner code { font: 11px var(--mono); color: var(--bright); user-select: text; -webkit-user-select: text;
      overflow: hidden; text-overflow: ellipsis; }
    #banner button { background: none; border: none; color: var(--dim); font: inherit; font-size: 14px;
      cursor: pointer; padding: 0 4px; }
    #banner button:hover { color: var(--bright); }

    /* Where the tablet's pen is: a hollow ring, filled while its button is held. */
    #presence { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--text); pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.25s; }
    #presence.on { opacity: 0.75; }
    #presence.button { background: var(--blue); border-color: var(--blue); }

    #page { position: absolute; background: var(--page); overflow: hidden; border-radius: 4px;
      box-shadow: 0 0 0 1px var(--edge); }
    #page canvas.gl { position: absolute; top: 0; display: block; pointer-events: none; }
    #page canvas.gl.rest { z-index: 0; }
    /* The selected symbols on their own layer. The host clears to opaque
       black, so the layer is blended in rather than stacked: black is
       neutral under screen, and the light page's inverted white under
       multiply. */
    #page canvas.gl.lifted { z-index: 1; mix-blend-mode: screen; }
    :root[data-theme="light"] #page canvas.gl.lifted { mix-blend-mode: multiply; }
    :root[data-theme="light"] canvas.gl { filter: invert(1) hue-rotate(180deg); }
    #ink { position: absolute; left: 0; top: 0; touch-action: none; cursor: crosshair; z-index: 2; }

    #ring { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
    .chip { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; background: var(--chip);
      box-shadow: 0 0 0 1px var(--edge), 0 6px 24px rgba(0,0,0,0.35); overflow: hidden;
      animation: chipIn 0.28s ease-out both; }
    .chip .thumb { position: absolute; left: 0; right: 0; top: 9%; height: 58%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .chip .thumb canvas.gl { position: relative; flex: none; }
    .chip .label { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; line-height: 1.15; }
    .chip .label b { display: block; color: var(--bright); font-weight: 500; font-size: 11px; }
    .chip .label span { color: var(--text); font: 9.5px var(--mono); }
    .chip:not(.drawn) .label { bottom: auto; top: 50%; transform: translateY(-50%); }
    @keyframes chipIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } }

    /* The catalogue: the whole vocabulary as a shelf of pictures (cataloguepanel.ts).
       A sheet at the right; click a tile to import it, drag it onto the page to place it. */
    #catalogue { position: fixed; top: 44px; right: 0; bottom: 0; width: 372px; max-width: 100vw; z-index: 8;
      display: flex; flex-direction: column; background: var(--bg); box-shadow: -1px 0 0 var(--edge);
      transform: translateX(100%); visibility: hidden;
      transition: transform 0.24s cubic-bezier(.2,.7,.2,1), visibility 0s linear 0.24s, opacity 0.2s; }
    #catalogue.open { transform: none; visibility: visible; transition: transform 0.24s cubic-bezier(.2,.7,.2,1); }
    #catalogue.dragging { opacity: 0.35; }
    #catalogue .cat-head { display: flex; align-items: center; padding: 14px 14px 10px 18px; }
    #catalogue .cat-title { flex: 1; display: flex; align-items: baseline; gap: 10px; }
    #catalogue .cat-title b { color: var(--bright); font-weight: 500; font-size: 13px; letter-spacing: 0.01em; }
    #catalogue .cat-count { color: var(--dim); font: 10.5px var(--mono); }
    #catalogue .cat-close { background: none; border: none; color: var(--dim); font-size: 17px; line-height: 1;
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer; }
    #catalogue .cat-close:hover { color: var(--bright); background: var(--edge); }
    #catalogue .cat-search { display: flex; align-items: center; gap: 8px; margin: 0 14px 6px; height: 34px;
      padding: 0 11px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--edge); background: var(--page); color: var(--dim); }
    #catalogue .cat-search:focus-within { box-shadow: inset 0 0 0 1px var(--blue); }
    #catalogue .cat-search span { font-size: 14px; }
    #catalogue .cat-search input { flex: 1; min-width: 0; background: none; border: none; outline: none;
      color: var(--bright); font: 12.5px -apple-system, "SF Pro", Inter, sans-serif; -webkit-appearance: none; }
    #catalogue .cat-search input::placeholder { color: var(--dim); }
    #catalogue .cat-search input::-webkit-search-cancel-button { display: none; }
    #catalogue .cat-scroll { flex: 1; overflow-y: auto; padding: 0 14px 14px; scrollbar-width: thin;
      scrollbar-color: var(--edge) transparent; }
    #catalogue .cat-section { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      margin: 16px 4px 9px; }
    #catalogue .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #catalogue .cat-empty { color: var(--dim); text-align: center; padding: 40px 0; }
    #catalogue .cat-empty[hidden], #catalogue [hidden] { display: none; }
    #catalogue .cat-tile { position: relative; border-radius: 10px; padding: 6px 6px 10px; cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--edge); transition: box-shadow 0.15s, background 0.15s; touch-action: none; }
    #catalogue .cat-tile:hover { background: color-mix(in srgb, var(--edge) 45%, transparent); }
    #catalogue .cat-tile.imported { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 70%, transparent); }
    #catalogue .cat-tile.lifted { opacity: 0.4; }
    #catalogue .cat-well { height: 112px; border-radius: 6px; background: var(--page); overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
    #catalogue .cat-well:not(.ready) { background: linear-gradient(100deg, var(--page) 40%, var(--edge) 50%, var(--page) 60%) 0 0 / 300% 100%;
      animation: shimmer 1.6s linear infinite; }
    @keyframes shimmer { to { background-position: -150% 0; } }
    #catalogue .cat-thumb { width: 100%; height: 100%; display: block; opacity: 0.6; transition: opacity 0.2s;
      animation: thumbIn 0.35s ease-out both; }
    #catalogue .cat-tile:hover .cat-thumb, #catalogue .cat-tile.imported .cat-thumb { opacity: 1; }
    @keyframes thumbIn { from { opacity: 0; } }
    :root[data-theme="light"] #catalogue .cat-thumb, :root[data-theme="light"] .cat-ghost img { filter: invert(1) hue-rotate(180deg); }
    #catalogue .cat-mono { color: var(--dim); font-size: 30px; font-weight: 300; }
    #catalogue .cat-name { color: var(--bright); font-size: 12px; font-weight: 500; margin: 9px 4px 2px; }
    #catalogue .cat-line { color: var(--text); font-size: 10.5px; line-height: 1.35; margin: 0 4px; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.7em; }
    #catalogue .cat-mark { position: absolute; top: 12px; right: 12px; width: 17px; height: 17px; border-radius: 50%;
      background: var(--blue); color: #fff; font-size: 10px; line-height: 17px; text-align: center; font-weight: 600;
      opacity: 0; transform: scale(0.6); transition: opacity 0.15s, transform 0.15s; }
    #catalogue .cat-tile.imported .cat-mark { opacity: 1; transform: none; }
    #catalogue .cat-foot { color: var(--dim); font-size: 10.5px; padding: 10px 18px 12px; box-shadow: 0 -1px 0 var(--edge); }
    .cat-ghost { position: fixed; z-index: 20; pointer-events: none; transform: translate(-50%, -50%); display: flex;
      flex-direction: column; align-items: center; gap: 4px; opacity: 0.85; transition: opacity 0.12s; }
    .cat-ghost img { width: 120px; height: 84px; border-radius: 8px; box-shadow: 0 0 0 1px var(--edge), 0 10px 30px rgba(0,0,0,0.45); }
    .cat-ghost span { color: var(--bright); font-size: 11px; background: var(--page); padding: 1px 7px; border-radius: 5px; }
    .cat-ghost.over { opacity: 1; }
    .cat-ghost.over img { box-shadow: 0 0 0 1px var(--blue), 0 10px 30px rgba(0,0,0,0.45); }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="brand">DreamTalk · whiteboard</span>
    <button id="transform" title="Make it real (Enter, or a button-held tap inside the selection)">✦</button>
    <button id="undo" title="Undo (⌘Z)">↶</button>
    <button id="redo" title="Redo (⇧⌘Z)">↷</button>
    <button id="live" aria-pressed="false" title="Live distill: passes traced over each other become the one line they mean when the pen rests (off: select + ≋ / D)">≋ live</button>
    <span class="sep"></span>
    <button id="theme" title="Dark / light page">◐ dark</button>
    <button id="clear" title="Clear the page (undoable)">clear</button>
    <span id="status"></span>
    <span class="spacer"></span>
    <button class="imports" id="imports" title="The vocabulary this board imports — open the catalogue (I)"></button>
    <input id="board" list="boards" spellcheck="false" autocomplete="off" title="Board — a scene file, core/demo/boards/&lt;name&gt;.board.json. Type a name + Enter to open or start one." />
    <datalist id="boards"></datalist>
    <a id="toeditor" target="dreamtalk-editor" title="The same scene in the DreamTalk editor — camera, timeline, choreography">open in editor ↗</a>
    <span class="tabletdot" id="tabletdot"></span>
  </div>
  <div id="catalogue"></div>
  <div id="banner"><span>reMarkable needs its one-time key — run:</span><code></code><button title="Dismiss">×</button></div>
  <div id="page">
    <canvas id="ink"></canvas>
    <div id="ring"></div>
    <div id="presence"></div>
  </div>
  <script type="module" src="/core/sketch/dist/main.js"></script>
</body>
</html>
